name: Setup web-user Node environment
description: Installs Node 20, restores the npm cache, and installs dependencies via npm ci. Requires actions/checkout to be run first.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: web-user/package-lock.json

    - name: Install npm dependencies
      shell: bash
      working-directory: web-user
      run: npm ci
