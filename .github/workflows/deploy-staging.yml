name: Deploy to staging (EKS)

# helm upgrade against the running staging cluster (docs/deploy.md's Step
# 3.c), then terraform/staging/verify.sh, the same checks run.sh uses.
# Authenticates via GitHub OIDC, no stored AWS keys. Requires a `staging`
# GitHub Environment and the STAGING_GITHUB_ACTIONS_ROLE_ARN / AWS_REGION
# variables, set from `terraform output github_actions_deploy_role_arn` and
# `terraform output aws_region` in terraform/staging.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: helm upgrade + verify
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Point kubectl/helm at the staging cluster
        run: aws eks update-kubeconfig --name csat-staging --region ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: helm upgrade
        run: >
          helm upgrade csat kubernetes/chart --namespace csat
          -f kubernetes/chart/values-staging.yaml --wait --timeout 8m

      - name: Verify API and app through the ALB
        run: |
          alb=$(kubectl get ingress csat -n csat -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          terraform/staging/verify.sh "$alb"
