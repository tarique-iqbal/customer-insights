name: Deploy to staging (EKS)

# Click-button form of docs/deploy.md's Step 3.c: helm upgrade against the
# already-running staging cluster, then the same curl-with-Host-header
# verification terraform/staging/run.sh does by hand. Requires the
# `staging` GitHub Environment to exist with a required reviewer (repo
# settings, not this file) and the STAGING_GITHUB_ACTIONS_ROLE_ARN /
# AWS_REGION variables to be set from terraform/staging's own outputs —
# see notes/cicd-qna.md for the one-time setup this depends on.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: helm upgrade + verify
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Point kubectl/helm at the staging cluster
        run: aws eks update-kubeconfig --name csat-staging --region ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: helm upgrade
        run: >
          helm upgrade csat kubernetes/chart --namespace csat
          -f kubernetes/chart/values-staging.yaml --wait --timeout 8m

      - name: Verify — curl the ALB's real hostname with the app Host header
        run: |
          host=$(kubectl get ingress csat -n csat -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: app.csat-staging.internal" "http://$host/")
          echo "HTTP $code"
          [ "$code" = "200" ]
