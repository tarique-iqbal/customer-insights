# Local kind cluster, set up for kind's standard ingress-nginx recipe:
# https://kind.sigs.k8s.io/docs/user/ingress/
# Host ports 80/443 map onto the node, which ingress-nginx listens on via a
# hostPort-backed Service — replaces the earlier per-service NodePorts, since
# an Ingress is how a real cluster is actually reached.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: csat
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
