# EKS via terraform/staging (private node subnets behind a NAT Gateway).
# Unlike values-dev.yaml, the hostnames below need no nip.io substitution:
# the AWS Load Balancer Controller provisions an ALB with its own DNS name
# from this chart's Ingress, and clients reach it with a `-H "Host: ..."`
# override (see terraform/staging/run.sh). No DNS record points these
# hostnames at the ALB.
api:
  appEnv: staging
  corsAllowOrigin: http://app.csat-staging.internal
mysql:
  # Same in-cluster StatefulSet as dev/local, no RDS. Throwaway credentials;
  # 3306 is never exposed outside the cluster.
  credentials:
    password: staging
    rootPassword: staging
  # Same sizing and node class as values-dev.yaml; see its comment for why
  # 512Mi is the floor.
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      memory: 512Mi
backend:
  # The CI-published prod image (no xdebug, no dev deps), pinned by commit
  # SHA. Static reference: it doesn't track main, so bump it via
  # bump-pin.yml or by hand after a push. Any pinned image must be built on
  # PHP >= 8.2.35: earlier 8.2.x is vulnerable to PHP2Shell
  # (CVE-2026-109618/109619, unauthenticated RCE).
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-php
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 160Mi
nginx:
  # Built by the same publish job as backend.image, so the two share a SHA
  # and move together.
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-nginx
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      memory: 32Mi
frontend:
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-web-user
    tag: "75a39ce9e6fdfe5b462a948a1dc31e9da4608d8a"
  containerPort: 80
  apiUrl: http://api.csat-staging.internal
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
# className "alb" needs the AWS Load Balancer Controller installed first
# (terraform/staging/run.sh does this, using the IRSA role Terraform
# output). target-type "ip" routes directly to pod IPs (EKS's VPC CNI gives
# every pod a real VPC IP, so this works) instead of via each node's
# NodePort — fewer hops, and correct even though the nodes themselves sit
# in private subnets with no public exposure of their own.
ingress:
  enabled: true
  className: alb
  apiHost: api.csat-staging.internal
  appHost: app.csat-staging.internal
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
