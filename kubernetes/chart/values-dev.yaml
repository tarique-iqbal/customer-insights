# Ephemeral k3s-on-EC2 environment (terraform/dev), not kind and not
# the long-lived self-hosted-EC2 production environment. Apply that
# Terraform first, then replace every REPLACE_ME_WORKER_IP below with its
# `worker_public_ip` output before `helm upgrade --install` — or just run
# terraform/dev/run.sh, which does this (and the rest of the runbook:
# fetching a kubeconfig, installing ingress-nginx, deploying, verifying,
# tearing down) automatically.

api:
  appEnv: dev
  corsAllowOrigin: http://app.REPLACE_ME_WORKER_IP.nip.io
mysql:
  # Same in-cluster StatefulSet as local, no RDS. Throwaway credentials, same
  # spirit as values-local.yaml's — nothing here is meant to outlive a test
  # session, and 3306 is never exposed outside the cluster (the worker's
  # Security Group only opens 80/443 externally).
  credentials:
    password: dev
    rootPassword: dev
  # MySQL 8.0's InnoDB init needs more than 256Mi and gets OOMKilled
  # (exit 137) below it, regardless of node size. 512Mi requires a
  # t3.medium-class node (terraform/dev's instance_type), not a ~1GiB
  # t2.micro.
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      memory: 512Mi
backend:
  # The CI-published prod image (no xdebug, no dev deps), pinned by commit
  # SHA. Static reference: it doesn't track main, so bump it via
  # bump-pin.yml or by hand after a push. Any pinned image must be built on
  # PHP >= 8.2.35: earlier 8.2.x is vulnerable to PHP2Shell
  # (CVE-2026-109618/109619, unauthenticated RCE).
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-php
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 160Mi
nginx:
  # Built by the same publish job as backend.image, so the two share a SHA
  # and move together.
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-nginx
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      memory: 32Mi
frontend:
  # The CI-published static prod build (nginx-served, not the Vite dev
  # server); apiUrl below is injected at runtime via env.js.
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-web-user
    tag: "75a39ce9e6fdfe5b462a948a1dc31e9da4608d8a"
  containerPort: 80
  apiUrl: http://api.REPLACE_ME_WORKER_IP.nip.io
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
# className stays the values.yaml default ("nginx") — ingress-nginx needs
# installing on this cluster the same way it's installed separately for
# kind, except it needs a bare-metal-style install (controller.hostNetwork,
# since there's no AWS Load Balancer Controller or cloud-controller-manager
# wiring here to ever satisfy a LoadBalancer-type Service) — see
# terraform/dev/run.sh for the actual install command.
ingress:
  enabled: true
  apiHost: api.REPLACE_ME_WORKER_IP.nip.io
  appHost: app.REPLACE_ME_WORKER_IP.nip.io
