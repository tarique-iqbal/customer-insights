# Defaults shared by every environment; values-dev.yaml overrides them for the
# local kind cluster.
#
# Resource names (mysql, php, nginx, web-user) are fixed on purpose: nginx's
# default.conf reaches php at "php:9000" and the app reaches the database at
# "mysql", so a per-release name prefix would break both. Install one release
# per namespace.

api:
  appEnv: dev
  corsAllowOrigin: http://localhost:5173

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  database: csat
  user: local
  storage: 1Gi
  # Name of an existing Secret with the keys "password" (the app user's
  # password, also passed to the app as DB_PASS) and "root-password". This is
  # how production supplies credentials, so nothing sensitive reaches git or
  # the Helm release. If empty, the chart creates a Secret named "csat-db"
  # from `credentials` below, which is meant for local development only.
  existingSecret: ""
  credentials:
    password: ""
    rootPassword: ""
  # Rough starting numbers, not yet tuned from real metrics (no
  # metrics-server in kind). No CPU limit anywhere: a limit only throttles,
  # it doesn't protect the node the way a memory limit does. InnoDB's buffer
  # pool is the main memory consumer, generous here since MySQL is the one
  # thing that shouldn't get OOMKilled mid-write.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

backend:
  image:
    repository: csat-php
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  # docker/php/php.ini caps a single script at memory_limit=512M — that's
  # PHP's per-worker ceiling, not the container's. pm.max_children=5 means up
  # to 5 workers could each want that much in theory (2.5Gi worst case), but
  # real usage for this app is far below it. The 512Mi limit below covers one
  # worker's worth as a rough number, not a measured one.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Disabled by default; values-dev.yaml turns it on. When enabled, .replicas
  # above is ignored by the Deployment template — the HPA owns replica count
  # instead, and leaving both set would fight each other on every
  # `helm upgrade` (Helm resets it, the HPA changes it back).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

nginx:
  image:
    repository: csat-nginx
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    nodePort: null
  # Just a reverse proxy to php — lightweight.
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi
  # See backend.autoscaling for why .replicas is ignored when this is enabled.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: csat-web-user
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  # Browser-facing URL: it must resolve from the developer's machine, not from
  # inside the cluster.
  apiUrl: http://localhost:8080
  service:
    type: ClusterIP
    nodePort: null
  # The Vite dev server (esbuild + Node) is heavier than a static prod build
  # would be — Phase 3 replaces this with a built bundle served by nginx.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # See backend.autoscaling for why .replicas is ignored when this is enabled.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# Disabled by default; values-dev.yaml turns it on. Production would set its
# real hostnames and switch className/annotations for the AWS Load Balancer
# Controller (Phase 4).
ingress:
  enabled: false
  className: nginx
  apiHost: ""
  appHost: ""
