# Local kind cluster: kubernetes/kind-config.yaml maps host ports 80/443 onto
# ingress-nginx (installed separately, not part of this chart):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
# Services stay ClusterIP (values.yaml's default); the Ingress below is
# how they're reached.
mysql:
  # Throwaway dev credentials, the same values compose.yml uses. Production
  # sets mysql.existingSecret instead and keeps the real values out of git.
  credentials:
    password: secret
    rootPassword: secret
# Needs metrics-server installed separately (like ingress-nginx above, not
# part of this chart):
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch deployment metrics-server -n kube-system --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
# (the --kubelet-insecure-tls patch is kind-specific — its kubelet certs
# fail the default TLS check; don't carry that flag into a real cluster).
backend:
  autoscaling:
    enabled: true
  # The CI-published prod image (no xdebug, no dev deps), pinned by commit
  # SHA. Static reference: it doesn't track main, so bump it via
  # bump-pin.yml or by hand after a push. Any pinned image must be built on
  # PHP >= 8.2.35: earlier 8.2.x is vulnerable to PHP2Shell
  # (CVE-2026-109618/109619, unauthenticated RCE).
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-php
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
nginx:
  autoscaling:
    enabled: true
  # Built by the same publish job as backend.image, so the two share a SHA
  # and move together.
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-nginx
    tag: "51356eac73c585f0c316c95f7c8bf701279c0fcf"
# *.localtest.me resolves to 127.0.0.1 by design (a public DNS wildcard), so
# these work with no /etc/hosts edit.
api:
  corsAllowOrigin: http://app.localtest.me
frontend:
  apiUrl: http://api.localtest.me
  autoscaling:
    enabled: true
  # The CI-published static prod build (nginx-served, no node/npm); apiUrl
  # above is injected at runtime via env.js.
  image:
    repository: ghcr.io/tarique-iqbal/customer-insights/csat-web-user
    tag: "75a39ce9e6fdfe5b462a948a1dc31e9da4608d8a"
  containerPort: 80
ingress:
  enabled: true
  apiHost: api.localtest.me
  appHost: app.localtest.me
