{{- if not .Values.mysql.existingSecret }}
# Local development only: production sets mysql.existingSecret and creates
# that Secret outside the chart (for example from AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csat.dbSecretName" . }}
type: Opaque
stringData:
  password: {{ required "mysql.credentials.password is required unless mysql.existingSecret is set" .Values.mysql.credentials.password | quote }}
  root-password: {{ required "mysql.credentials.rootPassword is required unless mysql.existingSecret is set" .Values.mysql.credentials.rootPassword | quote }}
{{- end }}
