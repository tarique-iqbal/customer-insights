# default.conf's `fastcgi_pass php:9000;` resolves via in-cluster DNS to the
# php Service — same namespace, no config change needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  # See templates/backend/deployment.yaml for why this is explicit.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          ports:
            - containerPort: 80
          # nginx stops accepting connections almost immediately on SIGTERM,
          # which can race ahead of ingress-nginx/kube-proxy removing this Pod
          # from Service endpoints — a request can land here after it's
          # already stopped listening. Delaying the signal gives that removal
          # time to propagate first. Verified: without this, a rollout
          # dropped 3/200 requests; with it, 0/200.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Readiness goes end to end (nginx -> php-fpm -> app), so traffic
          # only reaches a Pod that can really serve it. Liveness stays a TCP
          # check on nginx itself: restarting nginx wouldn't fix a broken php.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
