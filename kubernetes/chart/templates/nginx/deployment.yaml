# default.conf's `fastcgi_pass php:9000;` resolves via in-cluster DNS to the
# php Service — same namespace, no config change needed in the common case.
# The initContainer below exists for one specific, observed failure: nginx
# resolves that hostname once, synchronously, at config-load time — not
# per-request — so a DNS lookup that's merely slow (not actually broken) at
# that exact instant crash-loops nginx permanently until it's restarted at
# a luckier moment. Seen for real on a self-hosted k3s/EC2 environment,
# even after cluster-level DNS was confirmed healthy and stable. Blocking
# on a successful resolution first removes
# that race without touching the shared nginx image/config used by
# Compose and kind too, both unaffected by this since they don't exhibit
# it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  {{- if not .Values.nginx.autoscaling.enabled }}
  replicas: {{ .Values.nginx.replicas }}
  {{- end }}
  # See templates/backend/deployment.yaml for why this is explicit.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: wait-for-php-dns
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup php.{{ .Release.Namespace }}.svc.cluster.local. >/dev/null 2>&1; do echo "waiting for php to resolve"; sleep 2; done
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          ports:
            - containerPort: 80
          # nginx stops accepting connections almost immediately on SIGTERM,
          # which can race ahead of ingress-nginx/kube-proxy removing this Pod
          # from Service endpoints — a request can land here after it's
          # already stopped listening. Delaying the signal gives that removal
          # time to propagate first. Verified: without this, a rollout
          # dropped 3/200 requests; with it, 0/200.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Readiness goes end to end (nginx -> php-fpm -> app), so traffic
          # only reaches a Pod that can really serve it. Liveness stays a TCP
          # check on nginx itself: restarting nginx wouldn't fix a broken php.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
