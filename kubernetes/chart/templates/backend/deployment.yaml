apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  replicas: {{ .Values.backend.replicas }}
  # Explicit, not relying on the Deployment default (25%/25%, which happens
  # to round to the same thing at 1 replica but stops being zero-downtime if
  # replicas ever changes): always start the new Pod and wait for it to be
  # Ready before removing the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
      annotations:
        # Environment variables are only read when a container starts, so
        # hashing the ConfigMap rolls the Pods whenever a setting changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: php
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          ports:
            - containerPort: 9000
          # Same race as nginx's preStop comment (kube-proxy hadn't yet
          # removed this Pod from the php Service's endpoints when php-fpm
          # stopped accepting connections on SIGTERM). Verified: without
          # this, a rollout dropped 1/200 requests; with it, 0/200.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "csat.dbSecretName" . }}
                  key: password
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
