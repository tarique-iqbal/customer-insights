# frontend.containerPort must match whichever image is configured: the dev
# image runs the Vite dev server (5173, no command override needed — vite.config.ts
# already sets server.host/port), the static prod image runs nginx (80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-user
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  # See templates/backend/deployment.yaml for why this is explicit.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-user
  template:
    metadata:
      labels:
        app: web-user
    spec:
      containers:
        - name: web-user
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          # Same race as nginx's preStop comment. Verified: without this, a
          # rollout dropped 3/200 requests; with it, 0/200.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            - name: VITE_API_URL
              value: {{ .Values.frontend.apiUrl | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
