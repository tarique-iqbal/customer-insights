# Routes by hostname to the two ClusterIP Services already in the chart —
# api.localtest.me -> nginx (the API), app.localtest.me -> web-user.
# *.localtest.me is a public DNS wildcard for 127.0.0.1, so this needs no
# /etc/hosts edit locally. In production this would use real hostnames and
# an ALB-specific className/annotations instead (Phase 4).
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csat
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.apiHost is required when ingress.enabled is true" .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
    - host: {{ required "ingress.appHost is required when ingress.enabled is true" .Values.ingress.appHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-user
                port:
                  number: 5173
{{- end }}
