# Single replica on a StatefulSet: the Pod keeps a stable identity (mysql-0),
# is never replaced while the old one might still be running, and its PVC
# (data-mysql-0) is created by volumeClaimTemplates, so deleting this release
# doesn't delete the data. kind's default StorageClass provisions the volume
# on the node, so `kind delete cluster` still wipes it. Production replaces
# this with Amazon RDS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  replicas: 1
  serviceName: mysql # the client Service; per-pod DNS would need a headless one
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "csat.dbSecretName" . }}
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "csat.dbSecretName" . }}
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # `mysqladmin ping` exits 0 whenever the server answers, even with
          # "Access denied", and 1 when it's down, so the probes need no
          # credentials (and the password stays out of the Pod spec).
          # Readiness and liveness stay off until the startup probe succeeds,
          # so a slow first-time init (up to ~150s) can't get the container
          # killed.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping"]
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
