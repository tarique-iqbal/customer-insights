# default.conf's `fastcgi_pass php:9000;` resolves via in-cluster DNS to the
# php Service defined in 20-php.yaml — same namespace, no config change needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: csat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: csat-nginx:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: csat
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # mapped to host :8080 via kind-config.yaml
