# config/load_env.php uses vlucas/phpdotenv, which reads an actual .env.{APP_ENV}
# FILE from disk (and throws if it's missing) — it doesn't fall back to real
# process env vars. docker-compose supplies that file via a host bind mount;
# a real pod has none, so we mount this ConfigMap as /var/www/api/.env.dev
# instead. DB_PASS lives here too for now (same throwaway "secret" value
# that's already committed in compose.yml / .env.example) — Phase 4
# splits this into a real Secret backed by AWS Secrets Manager.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env
  namespace: csat
data:
  .env.dev: |
    APP_ENV=dev

    DB_NAME=csat
    DB_USER=local
    DB_PASS=secret
    DB_HOST=mysql

    CORS_ALLOW_ORIGIN=http://localhost:5173
