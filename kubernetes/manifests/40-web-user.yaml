# CMD ["npm", "start"] runs `vite`, which already binds 0.0.0.0:5173 per
# vite.config.ts (server.host: true, server.port: 5173) — no command
# override needed here, unlike compose.yml's web-user service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-user
  namespace: csat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-user
  template:
    metadata:
      labels:
        app: web-user
    spec:
      containers:
        - name: web-user
          image: csat-web-user:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            # Browser-facing URL — must resolve from the developer's machine,
            # not from inside the cluster, so it points at the nginx NodePort.
            - name: VITE_API_URL
              value: http://localhost:8080
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-user
  namespace: csat
spec:
  type: NodePort
  selector:
    app: web-user
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173 # mapped to host :5173 via kind-config.yaml
