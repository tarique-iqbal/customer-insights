# Phase 1: single replica, emptyDir volume — data does not need to survive
# a pod restart yet. Phase 2 switches this to a PVC; Phase 4 replaces it
# with Amazon RDS entirely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: csat
spec:
  replicas: 1
  strategy:
    type: Recreate # a second MySQL pod can't share the same emptyDir
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: secret
            - name: MYSQL_DATABASE
              value: csat
            - name: MYSQL_USER
              value: local
            - name: MYSQL_PASSWORD
              value: secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: csat
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
