# Phase 1: single replica, data on an emptyDir. It survives a container
# crash but is lost when the Pod is replaced (rollout restart, image change).
# Phase 2 switches this to a PVC; Phase 4 replaces it with Amazon RDS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: csat
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two MySQL pods at once behind the same Service
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: secret
            - name: MYSQL_DATABASE
              value: csat
            - name: MYSQL_USER
              value: local
            - name: MYSQL_PASSWORD
              value: secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # Readiness and liveness stay off until this succeeds, so a slow
          # first-time init (up to ~150s) can't get the container killed.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: csat
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
