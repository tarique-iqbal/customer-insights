# Single replica on a StatefulSet: the Pod keeps a stable identity (mysql-0),
# is never replaced while the old one might still be running, and its PVC
# (data-mysql-0) is created by volumeClaimTemplates, so deleting this file
# doesn't delete the data. kind's default StorageClass provisions the volume
# on the node, so `kind delete cluster` still wipes it. Phase 4 replaces this
# with Amazon RDS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: csat
spec:
  replicas: 1
  serviceName: mysql # the client Service below; per-pod DNS would need a headless one
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: secret
            - name: MYSQL_DATABASE
              value: csat
            - name: MYSQL_USER
              value: local
            - name: MYSQL_PASSWORD
              value: secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # Readiness and liveness stay off until this succeeds, so a slow
          # first-time init (up to ~150s) can't get the container killed.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-psecret"]
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: csat
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
