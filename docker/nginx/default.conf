server {
    listen 80;
    server_name localhost;
    root /var/www/api/public;

    location / {
        # Reflects whatever Origin the browser sent, rather than a single
        # hardcoded one — this file is baked into the image once and shared
        # by every dev environment (compose's localhost:5173, kind's
        # app.localtest.me), which can't each get their own hardcoded value
        # without templating the file per environment (deferred; see
        # notes/k8s-roadmap.md). The app's own CORS_ALLOW_ORIGIN, used for
        # every real response, is still a fixed per-environment value.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin";
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
